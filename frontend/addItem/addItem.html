<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Item - CollegeMart</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../home/style.css">
    <style>
        .add-item-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        @media(max-width:640px){
            .add-item-container { margin: 0; border-radius: 0; padding: 20px 16px; }
        }
        .add-item-container h2 { margin-bottom: 4px; color: #2c3e50; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: #555; margin-bottom: 6px;
        }
        .required { color: #e74c3c; margin-left: 2px; }
        .optional  { color: #aaa; font-weight: 400; font-size: 12px; margin-left: 4px; }

        .add-item-container input,
        .add-item-container textarea,
        .add-item-container select {
            width: 100%; padding: 10px 12px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; box-sizing: border-box;
            font-family: inherit; transition: border 0.2s;
        }
        .add-item-container input:focus,
        .add-item-container textarea:focus,
        .add-item-container select:focus { border-color: #3498db; outline: none; }
        .add-item-container textarea { height: 90px; resize: vertical; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media(max-width:480px){ .two-col { grid-template-columns: 1fr; } }

        /* Type toggle */
        .type-toggle { display: flex; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
        .type-toggle button {
            flex: 1; padding: 10px; border: none; background: white;
            font-size: 14px; font-weight: 600; cursor: pointer; color: #888; transition: all 0.2s;
        }
        .type-toggle button.active { background: #3498db; color: white; }
        .type-toggle button:first-child { border-right: 1px solid #ddd; }

        /* Rent section */
        .rent-section {
            display: none; background: #f0f7ff;
            border: 1px solid #bee3f8; border-radius: 10px;
            padding: 20px; margin-bottom: 16px;
        }
        .rent-section.visible { display: block; }
        .rent-section-title { font-size: 14px; font-weight: 700; color: #2980b9; margin-bottom: 14px; }

        /* Image upload */
        .image-upload-area {
            border: 2px dashed #ddd; border-radius: 10px;
            padding: 20px; text-align: center; cursor: pointer;
            transition: border-color 0.2s; background: #fafafa;
        }
        .image-upload-area:hover { border-color: #3498db; background: #f0f7ff; }
        .image-upload-area input { display: none; }
        .upload-hint { color: #aaa; font-size: 13px; margin-top: 6px; }

        .image-previews {
            display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;
        }
        .image-preview-item {
            position: relative; width: 100px; height: 100px;
        }
        .image-preview-item img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 8px; border: 1px solid #ddd;
        }
        .remove-img-btn {
            position: absolute; top: -6px; right: -6px;
            background: #e74c3c; color: white; border: none;
            border-radius: 50%; width: 20px; height: 20px;
            font-size: 12px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            line-height: 1; padding: 0;
        }
        .img-count { font-size: 12px; color: #888; margin-top: 6px; }

        .submit-btn {
            width: 100%; padding: 13px; background: #3498db; color: white;
            font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; font-size: 15px; margin-top: 6px; transition: background 0.2s;
        }
        .submit-btn:hover:not(:disabled) { background: #2980b9; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error   { color: #e74c3c; font-size: 13px; margin-top: 10px; }
        .success { color: #27ae60; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">CollegeMart</div>
        <div class="nav-links">
            <a href="../home/home.html">← Back to Home</a>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
        <div class="navbar-right">
            <button class="hamburger" onclick="toggleMobileNav()"><span></span><span></span><span></span></button>
        </div>
    </div>
    <div class="mobile-menu" id="mobileNav">
        <a href="../home/home.html">🏠 Home</a>
        <button class="mobile-logout" onclick="logout()">🚪 Logout</button>
    </div>

    <div class="add-item-container">
        <h2>List an Item</h2>
        <p class="subtitle">Fill in the details to list your item on CollegeMart</p>

        <div id="addItemForm">

            <!-- TYPE -->
            <div class="form-group">
                <label>Listing Type <span class="required">*</span></label>
                <div class="type-toggle">
                    <button type="button" id="btnSell" class="active" onclick="setType('sell')">🏷️ Sell</button>
                    <button type="button" id="btnRent" onclick="setType('rent')">🔑 Rent</button>
                </div>
                <input type="hidden" id="type" value="sell">
            </div>

            <!-- TITLE -->
            <div class="form-group">
                <label>Item Title <span class="required">*</span></label>
                <input type="text" id="title" placeholder="e.g. Engineering Drawing Kit">
            </div>

            <!-- CATEGORY -->
            <div class="form-group">
                <label>Category <span class="required">*</span></label>
                <select id="category">
                    <option value="">Select a category...</option>
                </select>
            </div>

            <!-- DESCRIPTION -->
            <div class="form-group">
                <label>Description <span class="required">*</span></label>
                <textarea id="description" placeholder="Condition, age, usage, reason for selling..."></textarea>
            </div>

            <!-- PRICE -->
            <div class="form-group">
                <label id="priceLabel">Selling Price (₹) <span class="required">*</span></label>
                <input type="number" id="price" placeholder="e.g. 500" min="0">
            </div>

            <!-- RENT FIELDS -->
            <div class="rent-section" id="rentSection">
                <div class="rent-section-title">🔑 Rental Details</div>
                <div class="form-group">
                    <label>Price per Day (₹) <span class="required">*</span></label>
                    <input type="number" id="rentPricePerDay" placeholder="e.g. 50" min="1">
                </div>
                <div class="two-col">
                    <div class="form-group">
                        <label>Min Rental Days <span class="required">*</span></label>
                        <input type="number" id="minRentDays" placeholder="e.g. 1" min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label>Max Rental Days <span class="optional">(optional)</span></label>
                        <input type="number" id="maxRentDays" placeholder="e.g. 30" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Security Deposit (₹) <span class="optional">(optional, refundable)</span></label>
                    <input type="number" id="depositAmount" placeholder="e.g. 200" min="0">
                </div>
                <div class="two-col">
                    <div class="form-group">
                        <label>Available From <span class="optional">(optional)</span></label>
                        <input type="date" id="availableFrom">
                    </div>
                    <div class="form-group">
                        <label>Available To <span class="optional">(optional)</span></label>
                        <input type="date" id="availableTo">
                    </div>
                </div>
                <div class="form-group">
                    <label>Rental Conditions <span class="optional">(optional)</span></label>
                    <textarea id="rentConditions" style="height:70px;"
                        placeholder="e.g. Handle with care. Return in same condition."></textarea>
                </div>
            </div>

            <!-- PICKUP LOCATION -->
            <div class="form-group">
                <label>📍 Pickup Location <span class="optional">(optional)</span></label>
                <input type="text" id="pickupLocation" placeholder="e.g. Hostel 3, Room 204 / Main Gate / Library">
            </div>

            <!-- IMAGES (up to 4) -->
            <div class="form-group">
                <label>Photos <span class="required">*</span> <span class="optional">(up to 4 images)</span></label>
                <div class="image-upload-area" onclick="document.getElementById('imageInput').click()">
                    <div style="font-size:32px;">📷</div>
                    <div style="font-weight:600;color:#555;margin-top:6px;">Click to add photos</div>
                    <div class="upload-hint">JPG, PNG, WebP · Max 5MB each</div>
                    <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(this)">
                </div>
                <div class="image-previews" id="imagePreviews"></div>
                <div class="img-count" id="imgCount"></div>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="submitForm()">List Item</button>
        </div>

        <div id="message"></div>
    </div>

    <script src="../shared.js"></script>
    <script src="addItem.js"></script>
</body>
</html>
