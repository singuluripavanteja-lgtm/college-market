<!DOCTYPE html>
<html lang="en">
<head>
    <title>Messages - CollegeMart</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #22263a;
            --border: #2e3248;
            --accent: #6c63ff;
            --accent2: #ff6584;
            --text: #e8eaf6;
            --muted: #7b82a8;
            --success: #43e97b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--text); }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .logout-btn:hover { border-color: var(--accent2); color: var(--accent2); }

        /* MAIN LAYOUT */
        .page-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: var(--muted);
            margin-top: 6px;
            font-size: 14px;
        }

        /* CONVERSATION CARDS */
        .conv-list { display: flex; flex-direction: column; gap: 12px; }

        .conv-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .conv-card:hover {
            border-color: var(--accent);
            background: var(--surface2);
            transform: translateX(4px);
        }

        .conv-card.unread {
            border-left: 3px solid var(--accent);
        }

        .conv-avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .conv-product-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .conv-info { flex: 1; min-width: 0; }

        .conv-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .conv-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-time {
            font-size: 12px;
            color: var(--muted);
            flex-shrink: 0;
            margin-left: 10px;
        }

        .conv-product-name {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 3px;
            font-weight: 500;
        }

        .conv-last-msg {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--accent);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }

        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-state h3 {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .empty-state p { font-size: 14px; line-height: 1.6; }

        .empty-state a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        /* LOADING */
        .loading {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skeleton {
            background: var(--surface);
            border-radius: 14px;
            height: 82px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">CollegeMart</div>
        <div class="nav-links">
            <a href="../home/home.html">Home</a>
            <a href="../profile/profile.html">Profile</a>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="page-container">
        <div class="page-header">
            <h1>Messages</h1>
            <p>Your conversations with buyers and sellers</p>
        </div>

        <div id="convList" class="conv-list">
            <div class="loading">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </div>
    </div>

    <script src="../shared.js"></script>
    <script src="messages.js"></script>
</body>
</html>
